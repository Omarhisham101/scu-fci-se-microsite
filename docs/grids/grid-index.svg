ill="#0f172a">news</text><text x="396" y="272" font-family="monospace" font-size="11" fill="#334155">cards: repeat(auto-fit, minmax(16rem,1fr)) = 3 columns</text><rect x="388" y="412" width="784" height="118" fill="#fee2e2" stroke="#0f172a" stroke-width="2"/><text x="396" y="432" font-family="monospace" font-size="14" font-weight="bold" fill="#0f172a">timetable</text><text x="396" y="450" font-family="monospace" font-size="11" fill="#334155">one wide table, own scroll box</text><text x="20" y="948" font-family="monospace" font-size="12" fill="#334155">areas: "header" "main" "aside" "footer"  ->  64rem: "header header" "main aside" "footer footer"</text><text x="20" y="964" font-family="monospace" font-size="12" fill="#334155">skip link is first focus stop, above header (z-index layer)</text><text x="20" y="980" font-family="monospace" font-size="12" fill="#334155">news cards: auto-fit grid; timetable: overflow-x:auto region, table keeps its natural width</text><text x="1100" y="924" font-family="monospace" font-size="12" fill="#334155">drawn 2026-11-25, before css/site.css existed</text></svg>